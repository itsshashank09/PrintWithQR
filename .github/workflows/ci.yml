name: Check project

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run check
        env:
          VITE_SUPABASE_URL: https://printwithqr-test.invalid
          VITE_SUPABASE_ANON_KEY: offline-build-key
